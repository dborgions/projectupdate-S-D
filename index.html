<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOMA S&D Projectupdate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3b73ad; --brand-dark:#2c5882;
    --ink:#1b2533; --muted:#647186; --faint:#8a94a4;
    --line:#e6eaf0; --bg:#f5f7fa; --card:#ffffff;
    --planning:#647186; --planning-bg:#eef1f5;
    --loopt:#3b73ad;   --loopt-bg:#e8f0f8;
    --onhold:#c07814;  --onhold-bg:#fbf0db;
    --nazorg:#3f9784;  --nazorg-bg:#e6f3ef;
    --afgerond:#2f8f5b;--afgerond-bg:#e6f4ec;
    --radius:12px; --shadow:0 1px 2px rgba(27,37,51,.04), 0 4px 16px rgba(27,37,51,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 22px 80px}

  .banner{background:#fff7e6;border:1px solid #f0d9a8;color:#8a560d;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:18px;display:flex;gap:10px;align-items:center}
  .banner.err{background:#fdecef;border-color:#f3c2cc;color:#a02a44}
  .banner b{font-weight:600}

  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
  .brandblock{display:flex;align-items:center;gap:14px}
  .brandmark{width:42px;height:42px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;letter-spacing:.5px;flex:none}
  .brandblock h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.2px}
  .brandblock .sub{color:var(--muted);font-size:13px;margin-top:1px}
  .who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .who input{font:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;width:130px}
  .kijkbadge{font-size:12px;font-weight:600;color:var(--muted);background:#eef1f5;padding:6px 11px;border-radius:20px}

  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;transition:border-color .12s, box-shadow .12s;text-align:left;font:inherit}
  .stat:hover{border-color:#cdd6e2}
  .stat.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .stat .n{font-size:24px;font-weight:700;line-height:1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  .controls{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px 9px 34px;color:var(--ink)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .controls select{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer}
  .recent{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;user-select:none}
  .recent input{accent-color:var(--brand);width:15px;height:15px}
  .btn{appearance:none;border:none;font:inherit;font-weight:600;font-size:14px;border-radius:9px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:#cdd6e2}

  .group{margin-bottom:24px}
  .group-h{display:flex;align-items:center;gap:9px;margin:0 0 11px 2px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .group-h .count{color:var(--faint);font-weight:500;letter-spacing:0;text-transform:none}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;margin-bottom:11px;box-shadow:var(--shadow);transition:border-color .12s}
  .card:hover{border-color:#d6deea}
  .card-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .chip{font-size:12px;font-weight:500;color:var(--muted);background:#f0f3f7;padding:3px 9px;border-radius:6px;white-space:nowrap}
  .card h3{font-size:16px;font-weight:600;margin:0 0 7px;letter-spacing:-.1px}
  .card .body{font-size:14px;color:#384353;white-space:pre-wrap;word-break:break-word}
  .sub-note{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:8px}
  .sub-onhold{background:var(--onhold-bg);color:#8a560d}
  .sub-adoptie{background:var(--nazorg-bg);color:#2c6c5d}
  .sub-note .lbl{font-weight:600;display:block;margin-bottom:2px;font-size:11px;text-transform:uppercase;letter-spacing:.4px}

  .steps{margin-top:13px;border-top:1px solid var(--line);padding-top:10px}
  .steps-toggle{width:100%;appearance:none;border:none;background:none;font:inherit;display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 2px;text-align:left;color:var(--ink)}
  .steps-toggle:hover .chev{color:var(--brand)}
  .steps-static{display:flex;align-items:center;gap:10px;padding:4px 2px}
  .steps-head-l{flex:1;display:flex;align-items:baseline;gap:9px;min-width:0}
  .cur-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);flex:none}
  .cur-txt{font-size:13.5px;color:#384353;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cur-txt.cur-bezig{color:var(--loopt);font-weight:600}
  .cur-txt.cur-done{color:var(--afgerond);font-weight:500}
  .steps-meta{font-size:12px;color:var(--faint);font-weight:500;flex:none}
  .chev{color:var(--faint);flex:none;transition:transform .15s}
  .steps-toggle.open .chev{transform:rotate(180deg)}
  .steps-list{margin-top:6px;display:flex;flex-direction:column;gap:1px}
  .step{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#384353;user-select:none;border:none;background:none;font-family:inherit;width:100%;text-align:left}
  .step:hover{background:#f5f8fb}
  .step:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .step .box{width:18px;height:18px;border-radius:50%;border:1.8px solid #c4cdda;flex:none;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
  .step.bezig .box{border-color:var(--loopt)}
  .step.done .box{background:var(--afgerond);border-color:var(--afgerond)}
  .step .innerdot{width:8px;height:8px;border-radius:50%;background:var(--loopt)}
  .step .txt{flex:1;cursor:text;border-radius:5px;padding:1px 3px}
  .step .txt:hover{background:#eef2f7}
  .step .txt-edit{flex:1;font:inherit;font-size:13.5px;border:1px solid var(--brand);border-radius:6px;padding:3px 7px;color:var(--ink);background:#fff;outline:none}
  .step .grip{flex:none;display:flex;align-items:center;color:#c4cdda;cursor:grab;opacity:.4}
  .step:hover .grip{opacity:1;color:var(--muted)}
  .step .grip:active{cursor:grabbing}
  .step .box{cursor:pointer}
  .step .box:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .step.dragging{opacity:.4}
  .step.dragover{box-shadow:inset 0 2px 0 var(--brand)}
  .step-date{font-size:11.5px;color:var(--faint);flex:none;white-space:nowrap}
  .step.done .txt{color:var(--faint);text-decoration:line-through}
  .step.bezig .txt{color:var(--loopt);font-weight:600}
  .step .x{opacity:0;color:var(--faint);font-size:17px;line-height:1;padding:0 3px;border-radius:5px;cursor:pointer}
  .step:hover .x{opacity:1}
  .step .x:hover{color:#b3324a;background:#fbe9ec}
  .step-add{display:flex;align-items:center;gap:10px;padding:6px 8px}
  .step-add .plus{width:18px;text-align:center;color:var(--faint);font-size:16px;flex:none}
  .step-add input{flex:1;font:inherit;font-size:13.5px;border:none;border-bottom:1px dashed transparent;background:none;padding:3px 1px;color:var(--ink)}
  .step-add input::placeholder{color:var(--faint)}
  .step-add input:focus{outline:none;border-bottom-color:var(--brand)}

  .card-foot{display:flex;align-items:center;gap:14px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);flex-wrap:wrap}
  .card-foot .meta{display:flex;align-items:center;gap:6px}
  .card-foot .spacer{flex:1}
  .linkbtn{appearance:none;border:none;background:none;font:inherit;font-size:13px;color:var(--brand);cursor:pointer;font-weight:500;padding:2px 4px}
  .linkbtn:hover{text-decoration:underline}
  .linkbtn.del{color:var(--muted)}
  .linkbtn.del:hover{color:#b3324a}
  .recent-flag{color:var(--loopt);font-weight:600}

  .empty{text-align:center;padding:50px 20px;color:var(--faint);font-size:14px}
  .loading{text-align:center;padding:60px 20px;color:var(--faint);font-size:14px}

  .overlay{position:fixed;inset:0;background:rgba(20,28,40,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 18px;z-index:50;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(20,28,40,.3);overflow:hidden}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h2{font-size:17px;font-weight:700;margin:0}
  .modal-h button{appearance:none;border:none;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
  .modal-b{padding:20px 22px;max-height:62vh;overflow-y:auto}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--faint);font-size:12px;margin-top:-3px;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);background:#fff}
  .field textarea{resize:vertical;min-height:74px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,115,173,.12)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);cursor:pointer}
  .check input{width:16px;height:16px;accent-color:var(--brand)}
  .modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fafbfc}
  .hide{display:none!important}

  @media (max-width:720px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .row2{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>

  <header class="top">
    <div class="brandblock">
      <div class="brandmark">S&amp;D</div>
      <div>
        <h1>Projectupdate Staff &amp; Development</h1>
        <div class="sub">Maandelijkse status voor managers en belanghebbenden</div>
      </div>
    </div>
    <div id="whoBox" class="who">
      Jij bewerkt als
      <input id="editorName" type="text" placeholder="je naam">
    </div>
    <div id="kijkBox" class="kijkbadge hide">Kijkmodus</div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Zoek op project of toelichting...">
    </div>
    <select id="portFilter"><option value="">Alle portefeuilles</option></select>
    <label class="recent"><input type="checkbox" id="recentChk">Recent gewijzigd</label>
    <button class="btn btn-primary" id="addBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      Nieuw project
    </button>
  </div>

  <div id="board"><div class="loading">Laden...</div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-h">
      <h2 id="modalTitle">Nieuw project</h2>
      <button id="closeModal" aria-label="Sluiten">&times;</button>
    </div>
    <div class="modal-b">
      <div class="row2">
        <div class="field">
          <label for="f-port">Portefeuille</label>
          <select id="f-port"></select>
        </div>
        <div class="field">
          <label for="f-fase">Fase</label>
          <select id="f-fase">
            <option value="planning">Op planning</option>
            <option value="loopt">Loopt</option>
            <option value="nazorg">Nazorg &amp; adoptie</option>
            <option value="afgerond">Afgerond</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-naam">Project</label>
        <input id="f-naam" type="text" placeholder="Naam van het project">
      </div>
      <div class="field">
        <label for="f-notitie">Toelichting</label>
        <div class="hint">Korte context of achtergrond. De status zelf leg je vast met de fase en de stappen.</div>
        <textarea id="f-notitie" placeholder="Optioneel"></textarea>
      </div>
      <div class="field hide" id="wrap-adoptie">
        <label for="f-adoptie">Status adoptiefase</label>
        <textarea id="f-adoptie" placeholder="Hoe verloopt de adoptie door de teams?"></textarea>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="f-onhold">Dit project staat on hold</label>
      </div>
      <div class="field hide" id="wrap-reden">
        <label for="f-reden">Reden on hold</label>
        <input id="f-reden" type="text" placeholder="Waarom staat dit stil?">
      </div>
      <div class="field">
        <label for="f-deadline">Deadline of streefdatum</label>
        <input id="f-deadline" type="text" placeholder="Bijv. okt 2026">
      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" id="cancelModal">Annuleren</button>
      <button class="btn btn-primary" id="saveModal">Opslaan</button>
    </div>
  </div>
</div>

<script>
/* ===================================================================
   CONFIGURATIE  —  vul hier je Supabase-gegevens in om live te gaan.
   Zolang deze op de standaardwaarde staan draait de pagina in
   demomodus met voorbeelddata (niets wordt bewaard).
   =================================================================== */
const SUPABASE_URL = 'https://irgbdceorrmquyecqcnb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Qq2lIiTOXOHd-RwkKk3fLg_3U4Q4P6E';
/* =================================================================== */

const DEMO = SUPABASE_URL.includes('JOUW-PROJECT') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY==='JOUW-ANON-KEY';
const KIJK = new URLSearchParams(location.search).get('modus')==='kijk';

const FASES={
  planning:{label:'Op planning',c:'--planning',bg:'--planning-bg'},
  loopt:{label:'Loopt',c:'--loopt',bg:'--loopt-bg'},
  nazorg:{label:'Nazorg & adoptie',c:'--nazorg',bg:'--nazorg-bg'},
  afgerond:{label:'Afgerond',c:'--afgerond',bg:'--afgerond-bg'}
};
const ORDER=['loopt','nazorg','planning','afgerond'];
const PORTEFEUILLES=['HR','Marketing','Facilities','Opleiden','Automations','Data','Innovatie','Wagenpark','Jobboards','Activiteiten','Website/Welder','Intern Recruitment'];

let projects=[], editId=null, statusFilter='', expanded=new Set(), editor='', dragSrc=null, editingStep=false;

/* ---------- helpers ---------- */
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmtDate(iso){if(!iso)return '';const[y,m,d]=iso.slice(0,10).split('-');const mn=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];return `${parseInt(d)} ${mn[parseInt(m)-1]} ${y}`;}
const today=()=>new Date().toISOString().slice(0,10);
const nowISO=()=>new Date().toISOString();
function daysAgo(iso){if(!iso)return 9999;return (Date.now()-new Date(iso).getTime())/86400000;}
function isRecent(p){if(daysAgo(p.updated_at)<=30)return true;return (p.steps||[]).some(s=>s.status==='done'&&daysAgo(s.done_op)<=30);}

/* ---------- data layer (Supabase of demo) ---------- */
const H=()=>({apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=representation'});
async function dbList(){
  if(DEMO)return demoData.slice();
  const r=await fetch(SUPABASE_URL+'/rest/v1/projects?select=*&order=updated_at.desc',{headers:H()});
  if(!r.ok)throw new Error('Laden mislukt ('+r.status+')');
  return await r.json();
}
async function dbCreate(o){
  o.updated_at=nowISO();o.updated_by=editor;
  if(DEMO){o.id='p'+Date.now();demoData.unshift(o);return o;}
  const r=await fetch(SUPABASE_URL+'/rest/v1/projects',{method:'POST',headers:H(),body:JSON.stringify(o)});
  if(!r.ok)throw new Error('Opslaan mislukt ('+r.status+')');
  return (await r.json())[0];
}
async function dbUpdate(id,o){
  o.updated_at=nowISO();o.updated_by=editor;
  if(DEMO){Object.assign(demoData.find(x=>x.id===id),o);return;}
  const r=await fetch(SUPABASE_URL+'/rest/v1/projects?id=eq.'+id,{method:'PATCH',headers:H(),body:JSON.stringify(o)});
  if(!r.ok)throw new Error('Bijwerken mislukt ('+r.status+')');
}
async function dbDelete(id){
  if(DEMO){demoData=demoData.filter(x=>x.id!==id);return;}
  const r=await fetch(SUPABASE_URL+'/rest/v1/projects?id=eq.'+id,{method:'DELETE',headers:H()});
  if(!r.ok)throw new Error('Verwijderen mislukt ('+r.status+')');
}
async function reload(){try{projects=await dbList();renderSummary();renderBoard();}catch(e){showError(e.message);}}

/* ---------- banner ---------- */
function showError(msg){document.getElementById('banner').innerHTML=`<div class="banner err"><b>Er ging iets mis:</b> ${esc(msg)} Controleer je Supabase-gegevens.</div>`;}
function showDemoBanner(){document.getElementById('banner').innerHTML=`<div class="banner"><b>Demomodus.</b> Nog niet gekoppeld aan Supabase, wijzigingen worden niet bewaard. Vul je gegevens bovenin het script in om live te gaan.</div>`;}

/* ---------- render ---------- */
function renderSummary(){
  const counts={};Object.keys(FASES).forEach(k=>counts[k]=0);
  projects.forEach(p=>counts[p.fase]=(counts[p.fase]||0)+1);
  const onhold=projects.filter(p=>p.on_hold).length;
  const el=document.getElementById('summary');
  let html=ORDER.map(k=>{
    const s=FASES[k];
    return `<button class="stat ${statusFilter===k?'sel':''}" data-s="${k}">
      <div class="n" style="color:var(${s.c})">${counts[k]||0}</div>
      <div class="l"><span class="dot" style="background:var(${s.c})"></span>${s.label}</div>
    </button>`;
  }).join('');
  html+=`<button class="stat ${statusFilter==='onhold'?'sel':''}" data-s="onhold">
      <div class="n" style="color:var(--onhold)">${onhold}</div>
      <div class="l"><span class="dot" style="background:var(--onhold)"></span>On hold</div>
    </button>`;
  el.innerHTML=html;
  el.querySelectorAll('.stat').forEach(b=>b.onclick=()=>{statusFilter=statusFilter===b.dataset.s?'':b.dataset.s;renderSummary();renderBoard();});
}

function renderBoard(){
  const q=document.getElementById('search').value.toLowerCase();
  const pf=document.getElementById('portFilter').value;
  const recentOnly=document.getElementById('recentChk').checked;
  let list=projects.filter(p=>{
    if(statusFilter==='onhold'){if(!p.on_hold)return false;}
    else if(statusFilter&&p.fase!==statusFilter)return false;
    if(pf&&p.portefeuille!==pf)return false;
    if(recentOnly&&!isRecent(p))return false;
    if(q&&!(p.naam.toLowerCase().includes(q)||(p.notitie||'').toLowerCase().includes(q)))return false;
    return true;
  });
  const board=document.getElementById('board');
  if(!list.length){board.innerHTML='<div class="empty">Geen projecten gevonden. Pas je filter aan'+(KIJK?'.':' of voeg een nieuw project toe.')+'</div>';return;}

  const sortFn=(a,b)=>new Date(b.updated_at)-new Date(a.updated_at);
  let html='';
  if(statusFilter==='onhold'){
    html+=cardsHtml(list.sort(sortFn));
  }else{
    ORDER.forEach(k=>{
      const grp=list.filter(p=>p.fase===k).sort(sortFn);
      if(!grp.length)return;
      const s=FASES[k];
      html+=`<div class="group"><div class="group-h"><span class="dot" style="background:var(${s.c})"></span>${s.label} <span class="count">(${grp.length})</span></div>${cardsHtml(grp)}</div>`;
    });
  }
  board.innerHTML=html;
  wireBoard(board);
}

function cardsHtml(arr){
  return arr.map(p=>{
    const s=FASES[p.fase]||FASES.loopt;
    return `<div class="card">
      <div class="card-top">
        <span class="pill" style="color:var(${s.c});background:var(${s.bg})"><span class="dot" style="background:var(${s.c})"></span>${s.label}</span>
        ${p.on_hold?`<span class="pill" style="color:var(--onhold);background:var(--onhold-bg)"><span class="dot" style="background:var(--onhold)"></span>On hold</span>`:''}
        <span class="chip">${esc(p.portefeuille)}</span>
      </div>
      <h3>${esc(p.naam)}</h3>
      ${p.notitie?`<div class="body">${esc(p.notitie)}</div>`:''}
      ${p.on_hold&&p.on_hold_reden?`<div class="sub-note sub-onhold"><span class="lbl">Reden on hold</span>${esc(p.on_hold_reden)}</div>`:''}
      ${p.fase==='nazorg'&&p.adoptie?`<div class="sub-note sub-adoptie"><span class="lbl">Adoptiefase</span>${esc(p.adoptie)}</div>`:''}
      ${buildSteps(p)}
      <div class="card-foot">
        ${p.deadline?`<span class="meta"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${esc(p.deadline)}</span>`:''}
        <span class="meta ${isRecent(p)?'recent-flag':''}">Bijgewerkt ${fmtDate(p.updated_at)}${p.updated_by?' door '+esc(p.updated_by):''}</span>
        ${KIJK?'':`<span class="spacer"></span>
        ${p.fase!=='afgerond'?`<button class="linkbtn done-btn" data-done="${p.id}">Markeer afgerond</button>`:''}
        <button class="linkbtn" data-edit="${p.id}">Bewerken</button>
        <button class="linkbtn del" data-del="${p.id}">Verwijderen</button>`}
      </div>
    </div>`;
  }).join('');
}

function chev(){return '<svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>';}
function curSummary(steps){
  const done=steps.filter(s=>s.status==='done').length, total=steps.length;
  const bezig=steps.find(s=>s.status==='bezig'), nextTodo=steps.find(s=>s.status==='todo');
  let lbl='Stappen',txt='',cls='';
  if(bezig){lbl='Huidige stap';txt=bezig.tekst;cls='cur-bezig';}
  else if(total&&done===total){txt='Alle stappen afgerond';cls='cur-done';}
  else if(nextTodo){lbl='Volgende stap';txt=nextTodo.tekst;cls='cur-todo';}
  return {done,total,lbl,txt,cls};
}
function buildSteps(p){
  const steps=p.steps||[];
  if(KIJK){
    if(!steps.length)return '';
    const c=curSummary(steps);
    return `<div class="steps"><div class="steps-static">
      <span class="steps-head-l"><span class="cur-lbl">${c.lbl}</span><span class="cur-txt ${c.cls}">${esc(c.txt)}</span></span>
      <span class="steps-meta">${c.done}/${c.total}</span>
    </div></div>`;
  }
  const total=steps.length, done=steps.filter(s=>s.status==='done').length, isOpen=expanded.has(p.id);
  let head;
  if(isOpen){
    head=`<button class="steps-toggle open" data-toggle="${p.id}"><span class="steps-head-l"><span class="cur-lbl">Stappen</span>${total?`<span class="steps-meta">${done} van ${total} afgerond</span>`:''}</span>${chev()}</button>`;
  }else if(total===0){
    head=`<button class="steps-toggle" data-toggle="${p.id}"><span class="steps-head-l"><span class="cur-lbl">Stappen toevoegen</span></span>${chev()}</button>`;
  }else{
    const c=curSummary(steps);
    head=`<button class="steps-toggle" data-toggle="${p.id}"><span class="steps-head-l"><span class="cur-lbl">${c.lbl}</span><span class="cur-txt ${c.cls}">${esc(c.txt)}</span></span><span class="steps-meta">${done}/${total}</span>${chev()}</button>`;
  }
  let body='';
  if(isOpen){
    const items=steps.map((s,i)=>{
      let box='';
      if(s.status==='done')box='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4"><path d="M20 6 9 17l-5-5"/></svg>';
      else if(s.status==='bezig')box='<span class="innerdot"></span>';
      return `<div class="step ${s.status}" data-proj="${p.id}" data-step="${s.id}" data-idx="${i}" draggable="true">
        <span class="grip" title="Sleep om te ordenen"><svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="3" r="1.3"/><circle cx="8" cy="3" r="1.3"/><circle cx="2" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="2" cy="13" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg></span>
        <span class="box" role="button" tabindex="0" title="Klik om af te vinken">${box}</span>
        <span class="txt" title="Klik om te bewerken">${esc(s.tekst)}</span>
        ${s.status==='done'&&s.done_op?`<span class="step-date">${fmtDate(s.done_op)}</span>`:''}
        <span class="x" data-proj="${p.id}" data-step="${s.id}" title="Stap verwijderen">&times;</span>
      </div>`;
    }).join('');
    const add=`<div class="step-add"><span class="plus">+</span><input type="text" data-addstep="${p.id}" placeholder="Stap toevoegen, druk op enter"></div>`;
    body=`<div class="steps-list">${items}${add}</div>`;
  }
  return `<div class="steps">${head}${body}</div>`;
}

function wireBoard(board){
  board.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(b.dataset.edit));
  board.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delProject(b.dataset.del));
  board.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>markDone(b.dataset.done));
  board.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=b.dataset.toggle;expanded.has(id)?expanded.delete(id):expanded.add(id);renderBoard();});
  board.querySelectorAll('.step').forEach(el=>{
    const pid=el.dataset.proj, sid=el.dataset.step;
    const box=el.querySelector('.box');
    box.onclick=e=>{e.stopPropagation();cycleStep(pid,sid);};
    box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cycleStep(pid,sid);}};
    el.querySelector('.txt').onclick=e=>{e.stopPropagation();startEditStep(el,pid,sid);};
    el.ondragstart=e=>{dragSrc={pid,idx:+el.dataset.idx};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');};
    el.ondragend=()=>{el.classList.remove('dragging');board.querySelectorAll('.step.dragover').forEach(x=>x.classList.remove('dragover'));};
    el.ondragover=e=>{if(!dragSrc||dragSrc.pid!==pid)return;e.preventDefault();el.classList.add('dragover');};
    el.ondragleave=()=>el.classList.remove('dragover');
    el.ondrop=e=>{if(!dragSrc||dragSrc.pid!==pid)return;e.preventDefault();el.classList.remove('dragover');const to=+el.dataset.idx,from=dragSrc.idx;dragSrc=null;reorderStep(pid,from,to);};
  });
  board.querySelectorAll('.step .x').forEach(x=>x.onclick=e=>{e.stopPropagation();delStep(x.dataset.proj,x.dataset.step);});
  board.querySelectorAll('[data-addstep]').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())addStep(inp.dataset.addstep,inp.value);});
}

/* ---------- step actions ---------- */
async function cycleStep(pid,sid){
  const p=projects.find(x=>x.id===pid),s=p.steps.find(x=>x.id===sid);
  s.status=s.status==='todo'?'bezig':s.status==='bezig'?'done':'todo';
  if(s.status==='done')s.done_op=today();else s.done_op='';
  try{await dbUpdate(pid,{steps:p.steps});await reload();}catch(e){showError(e.message);}
}
async function addStep(pid,tekst){
  const p=projects.find(x=>x.id===pid);if(!p.steps)p.steps=[];
  p.steps.push({id:'s'+Date.now(),tekst:tekst.trim(),status:'todo'});
  try{await dbUpdate(pid,{steps:p.steps});await reload();
    const inp=document.querySelector(`[data-addstep="${pid}"]`);if(inp){inp.value='';inp.focus();}
  }catch(e){showError(e.message);}
}
async function delStep(pid,sid){
  const p=projects.find(x=>x.id===pid);p.steps=p.steps.filter(x=>x.id!==sid);
  try{await dbUpdate(pid,{steps:p.steps});await reload();}catch(e){showError(e.message);}
}
async function reorderStep(pid,from,to){
  if(from===to)return;
  const p=projects.find(x=>x.id===pid),arr=p.steps;
  const [moved]=arr.splice(from,1);
  arr.splice(from<to?to-1:to,0,moved);
  try{await dbUpdate(pid,{steps:arr});await reload();}catch(e){showError(e.message);}
}
function startEditStep(stepEl,pid,sid){
  if(editingStep)return;editingStep=true;
  const p=projects.find(x=>x.id===pid),s=p.steps.find(x=>x.id===sid);
  stepEl.setAttribute('draggable','false');
  const txt=stepEl.querySelector('.txt');
  const inp=document.createElement('input');
  inp.type='text';inp.className='txt-edit';inp.value=s.tekst;
  txt.replaceWith(inp);inp.focus();inp.select();
  let fin=false;
  const finish=async(save)=>{
    if(fin)return;fin=true;editingStep=false;
    const val=inp.value.trim();
    if(save&&val&&val!==s.tekst){s.tekst=val;try{await dbUpdate(pid,{steps:p.steps});}catch(e){showError(e.message);}}
    await reload();
  };
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish(true);}else if(e.key==='Escape'){e.preventDefault();finish(false);}};
  inp.onblur=()=>finish(true);
}
async function markDone(pid){
  const p=projects.find(x=>x.id===pid);
  if(!confirm(`"${p.naam}" op afgerond zetten?`))return;
  try{await dbUpdate(pid,{fase:'afgerond',on_hold:false});await reload();}catch(e){showError(e.message);}
}

/* ---------- modal ---------- */
function fillPortSelects(){
  const opts=PORTEFEUILLES.map(p=>`<option value="${p}">${p}</option>`).join('');
  document.getElementById('f-port').innerHTML=opts;
  document.getElementById('portFilter').innerHTML='<option value="">Alle portefeuilles</option>'+opts;
}
function toggleConditional(){
  document.getElementById('wrap-adoptie').classList.toggle('hide',document.getElementById('f-fase').value!=='nazorg');
  document.getElementById('wrap-reden').classList.toggle('hide',!document.getElementById('f-onhold').checked);
}
function openModal(id){
  editId=id||null;
  document.getElementById('modalTitle').textContent=id?'Project bewerken':'Nieuw project';
  const p=id?projects.find(x=>x.id===id):{portefeuille:PORTEFEUILLES[0],fase:'loopt',naam:'',notitie:'',adoptie:'',on_hold:false,on_hold_reden:'',deadline:''};
  document.getElementById('f-port').value=p.portefeuille;
  document.getElementById('f-fase').value=p.fase;
  document.getElementById('f-naam').value=p.naam;
  document.getElementById('f-notitie').value=p.notitie||'';
  document.getElementById('f-adoptie').value=p.adoptie||'';
  document.getElementById('f-onhold').checked=!!p.on_hold;
  document.getElementById('f-reden').value=p.on_hold_reden||'';
  document.getElementById('f-deadline').value=p.deadline||'';
  toggleConditional();
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');editId=null;}
async function saveProject(){
  const naam=document.getElementById('f-naam').value.trim();
  if(!naam){document.getElementById('f-naam').focus();return;}
  const onhold=document.getElementById('f-onhold').checked;
  const data={
    portefeuille:document.getElementById('f-port').value,
    fase:document.getElementById('f-fase').value,
    naam,
    notitie:document.getElementById('f-notitie').value.trim(),
    adoptie:document.getElementById('f-adoptie').value.trim(),
    on_hold:onhold,
    on_hold_reden:onhold?document.getElementById('f-reden').value.trim():'',
    deadline:document.getElementById('f-deadline').value.trim()
  };
  try{
    if(editId)await dbUpdate(editId,data);
    else{data.steps=[];await dbCreate(data);}
    closeModal();await reload();
  }catch(e){showError(e.message);}
}
async function delProject(id){
  const p=projects.find(x=>x.id===id);
  if(!confirm(`"${p.naam}" verwijderen?`))return;
  try{await dbDelete(id);await reload();}catch(e){showError(e.message);}
}
